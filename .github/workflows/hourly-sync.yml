name: Hourly Nollywood Catalogue Sync

on:
  schedule:
    # Runs at minute 0 of every hour (UTC)
    - cron: '0 * * * *'
  # Allows triggering the sync manually anytime from the GitHub Actions tab
  workflow_dispatch:

concurrency:
  group: hourly-sync-pipeline
  cancel-in-progress: false

jobs:
  sync-movies:
    name: Sync Nigerian Movies from TMDb to Firestore
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Execute Nollywood Movie Sync
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: node scripts/syncMovies.js
